<!doctype html>
<html lang="th" data-theme="business">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Login - OCR Config - STGT</title>
  <link href="/public/css/styles.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ================= Design tokens (shared with main app) ================= */
    :root {
      --bg-0: #09090b;
      --surface: #131317;
      --surface-2: #18181d;
      --surface-3: #1f1f26;
      --line: #2c2c35;
      --line-soft: #232329;
      --text-1: #ededf2;
      --text-2: #a7a7b1;
      --text-3: #6d6d78;
      --accent-1: #71717a;
      --accent-2: #b8b8c2;
      --grad-accent: linear-gradient(135deg, #3f3f46 0%, #71717a 50%, #b4b4be 100%);
      --err: #fb7185;
      --radius-lg: 1.1rem;
      --radius-md: .8rem;
      --font-ui: 'Inter', 'Noto Sans Thai', system-ui, 'Segoe UI', sans-serif;
    }

    html, body { font-family: var(--font-ui); }

    body {
      color: var(--text-1);
      background:
        radial-gradient(1100px 700px at 88% -10%, rgba(255, 255, 255, .06), transparent 60%),
        radial-gradient(900px 600px at -8% 108%, rgba(255, 255, 255, .04), transparent 55%),
        var(--bg-0);
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: rgba(113, 113, 122, .45); }

    /* Text cursor / selection only on editable fields */
    body { cursor: default; user-select: none; }

    input:not([type="checkbox"]):not([type="range"]):not([type="file"]),
    textarea {
      cursor: text;
      user-select: text;
    }

    .icon {
      width: 1.15em;
      height: 1.15em;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: inline-block;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--line-soft);
      border-radius: 1.4rem;
      padding: 2.5rem 2.25rem 2rem;
      box-shadow: 0 30px 70px -20px rgba(0, 0, 0, .6);
      position: relative;
      overflow: hidden;
    }

    /* gradient hairline on top of the card */
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background-image: var(--grad-accent);
    }

    .logo-tile {
      width: 68px;
      height: 68px;
      margin: 0 auto 1.1rem;
      border-radius: var(--radius-lg);
      background: var(--surface-2);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-tile img { width: 46px; height: 46px; object-fit: contain; }

    .title-font {
      font-weight: 800;
      letter-spacing: -.02em;
      background-image: var(--grad-accent);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .subtitle-font {
      font-size: .72rem;
      font-weight: 500;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--text-3);
    }

    .field-label {
      display: flex;
      align-items: center;
      gap: .45rem;
      font-size: .8rem;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: .45rem;
    }

    .field-label .icon { width: .95rem; height: .95rem; color: var(--text-3); }

    .modern-input {
      width: 100%;
      padding: .8rem 1rem;
      background: var(--surface-3);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      color: var(--text-1);
      font-family: var(--font-ui);
      font-size: .9rem;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    .modern-input::placeholder { color: var(--text-3); }

    .modern-input:focus {
      outline: none;
      border-color: var(--accent-1);
      box-shadow: 0 0 0 3px rgba(148, 148, 160, .22);
    }

    .modern-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      width: 100%;
      padding: .85rem 1.5rem;
      border: none;
      border-radius: var(--radius-md);
      background-image: var(--grad-accent);
      color: #fff;
      font-family: var(--font-ui);
      font-weight: 600;
      font-size: .92rem;
      letter-spacing: .01em;
      cursor: pointer;
      transition: all .18s ease;
    }

    .modern-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.12);
      box-shadow: 0 8px 22px rgba(0, 0, 0, .5);
    }

    .modern-btn:active { transform: translateY(0); }

    .modern-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(148, 148, 160, .4);
    }

    .error-box {
      display: flex;
      align-items: center;
      gap: .55rem;
      background: rgba(251, 113, 133, .08);
      border: 1px solid rgba(251, 113, 133, .35);
      color: #fda4af;
      padding: .75rem 1rem;
      border-radius: var(--radius-md);
      font-size: .82rem;
      font-weight: 500;
    }

    .error-box .icon { color: var(--err); flex: none; }

    .error-box.hidden { display: none; }

    .footer-text {
      font-size: .68rem;
      font-weight: 400;
      letter-spacing: .04em;
      color: var(--text-3);
    }

    /* Password Toggle */
    .password-container { position: relative; }

    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: .5rem;
      transition: all .18s ease;
      color: var(--text-3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .password-toggle:hover {
      background: var(--surface-2);
      color: var(--text-1);
    }

    .password-toggle:focus {
      outline: none;
      background: var(--surface-2);
    }

    .password-toggle svg {
      width: 18px;
      height: 18px;
      transition: opacity .2s ease;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="login-card">
      <!-- Logo and Title -->
      <div class="text-center mb-8">
        <div class="logo-tile">
          <img alt="STGT Logo" src="/public/img/glove_character.png" />
        </div>
        <h1 class="text-2xl title-font mb-1">STA-SK</h1>
        <p class="subtitle-font">OCR Vision System</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-6">
        <div class="space-y-4">
          <!-- Username Field -->
          <div>
            <label for="username" class="field-label">
              <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              Username
            </label>
            <input
              type="text"
              id="username"
              name="username"
              required
              class="modern-input"
              placeholder="Enter your username"
            />
          </div>

          <!-- Password Field -->
          <div>
            <label for="password" class="field-label">
              <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              Password
            </label>
            <div class="password-container">
              <input
                type="password"
                id="password"
                name="password"
                required
                class="modern-input pr-12"
                placeholder="Enter your password"
              />
              <button
                type="button"
                id="togglePassword"
                class="password-toggle"
                aria-label="Toggle password visibility"
              >
                <!-- Eye Icon (Hidden) -->
                <svg id="eyeHidden" class="opacity-100" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
                <!-- Eye Icon (Visible) -->
                <svg id="eyeVisible" class="opacity-0 absolute" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="hidden error-box">
          <svg class="icon" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span>Invalid username or password</span>
        </div>

        <!-- Login Button -->
        <button type="submit" class="modern-btn">
          <svg class="icon" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Sign In
        </button>
      </form>

      <!-- Footer -->
      <div class="mt-7 text-center">
        <p class="footer-text">
          &copy; 2025 PREMIER SYSTEM ENGINEERING CO., LTD
        </p>
      </div>
    </div>
  </div>

  <script type="text/javascript">
    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');

    // Password Toggle Functionality
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeHidden = document.getElementById('eyeHidden');
    const eyeVisible = document.getElementById('eyeVisible');

    togglePassword.addEventListener('click', function() {
      // Toggle password input type
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeHidden.classList.remove('opacity-100');
        eyeHidden.classList.add('opacity-0');
        eyeVisible.classList.remove('opacity-0');
        eyeVisible.classList.add('opacity-100');
      } else {
        passwordInput.type = 'password';
        eyeHidden.classList.remove('opacity-0');
        eyeHidden.classList.add('opacity-100');
        eyeVisible.classList.remove('opacity-100');
        eyeVisible.classList.add('opacity-0');
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      // Hide previous error message
      errorMessage.classList.add('hidden');

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password }),
        });

        const result = await response.json();

        if (result.success) {
          // Redirect to main page
          window.location.href = '/';
        } else {
          // Show error message
          errorMessage.classList.remove('hidden');
        }
      } catch (error) {
        console.error('Login error:', error);
        errorMessage.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
